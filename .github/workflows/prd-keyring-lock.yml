name: PR-D Keyring Lockfile and Doc Closure

on:
  push:
    branches:
      - feat/persistent-credential-delegation-broker

permissions:
  contents: write

jobs:
  close-prd-generated-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve keyring dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts '@napi-rs/keyring@^1.3.0'

      - name: Apply PR-D documentation closure
        run: node scripts/close_prd_docs.mjs

      - name: Commit generated closure files when changed
        run: |
          if git diff --quiet -- package.json package-lock.json README.md SECURITY.md; then
            echo "PR-D generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md SECURITY.md
          git commit -m "chore: close PR-D generated files"
          git push origin HEAD:${GITHUB_REF_NAME}
