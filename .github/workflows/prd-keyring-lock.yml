name: PR-D Keyring Lockfile

on:
  push:
    branches:
      - feat/persistent-credential-delegation-broker

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore: generate keyring lockfile')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve keyring dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts '@napi-rs/keyring@^1.3.0'

      - name: Commit npm-generated manifest and lockfile when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "package.json and package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: generate keyring lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
