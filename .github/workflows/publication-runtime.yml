name: Publication Runtime

on:
  push:
    branches:
      - feat/mcp-publication-runtime-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # TEMPORARY FOR DRAFT PR #5 ONLY.
      # The implementation adds @myriaddreamin/typst-ts-node-compiler@0.7.0,
      # but this ChatGPT execution environment cannot run npm to regenerate the
      # lockfile. Once package-lock.json is generated and committed by a real
      # runner, change this step back to `npm ci` before taking the PR out of Draft.
      - name: Install dependencies
        run: npm install

      - name: Publication tests
        run: npm run test:publication

      - name: Build
        run: npm run build

      - name: Dynamic logic regression
        run: npm run verify:dynamic-logic

      - name: Dynamic rendering regression
        run: npm run verify:dynamic-rendering
