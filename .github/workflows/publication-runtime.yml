name: Publication Runtime

on:
  push:
    branches:
      - feat/mcp-publication-runtime-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # TEMPORARY FOR DRAFT PR #5 ONLY.
      # npm install regenerates package-lock.json with the new Node Typst compiler.
      # The generated lockfile is uploaded below, then committed back to this branch.
      - name: Install dependencies
        run: npm install

      - name: Upload generated package-lock
        uses: actions/upload-artifact@v4
        with:
          name: publication-runtime-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error

      - name: Publication tests
        run: npm run test:publication

      - name: Build
        run: npm run build

      - name: Dynamic logic regression
        run: npm run verify:dynamic-logic

      - name: Dynamic rendering regression
        run: npm run verify:dynamic-rendering
