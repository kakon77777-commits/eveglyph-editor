name: Publication Runtime

on:
  push:
    branches:
      - feat/mcp-publication-runtime-mvp
      - feat/github-connector-broker
      - feat/google-drive-connector-broker
      - feat/persistent-credential-delegation-broker
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prd-keyring-lockfile:
    if: github.ref_name == 'feat/persistent-credential-delegation-broker' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve keyring dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts '@napi-rs/keyring@^1.3.0'

      - name: Commit npm-generated manifest and lockfile when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "package.json and package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: generate keyring lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}

  publication-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Credential broker tests
        run: npm run test:credential-broker

      - name: Google connector tests
        run: npm run test:google-connector

      - name: GitHub connector tests
        run: npm run test:github-connector

      - name: Capability sandbox tests
        run: npm run test:capabilities

      - name: Publication tests
        run: npm run test:publication

      - name: Build
        run: npm run build

      - name: Verify built GitHub connector client
        run: node scripts/verify_github_connector_build.mjs

      - name: Verify built Google Drive connector client
        run: node scripts/verify_google_drive_connector_build.mjs

      - name: Dynamic logic regression
        run: npm run verify:dynamic-logic

      - name: Dynamic rendering regression
        run: npm run verify:dynamic-rendering

      - name: Package verified PR source
        run: git archive --format=zip --output=eveglyph-persistent-credential-delegation-broker.zip HEAD

      - name: Upload verified PR source
        uses: actions/upload-artifact@v4
        with:
          name: eveglyph-persistent-credential-delegation-broker
          path: eveglyph-persistent-credential-delegation-broker.zip
          if-no-files-found: error
          retention-days: 14
