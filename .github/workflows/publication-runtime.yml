name: Publication Runtime

on:
  push:
    branches:
      - feat/mcp-publication-runtime-mvp
      - feat/github-connector-broker
      - feat/google-drive-connector-broker
      - feat/persistent-credential-delegation-broker
      - feat/mcp-delegated-connector-operations
      - feat/wasmtime-document-sandbox-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wasmtime import-policy tests
        run: node --test test/wasmtime-import-policy.test.mjs

      - name: Wasmtime runtime contract tests
        run: node --test test/wasmtime-runtime-contract.test.mjs

      - name: Setup Wasmtime 48.0.0
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "48.0.0"

      - name: Setup wasm-tools 1.254.0
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.254.0"

      - name: Verify sandbox toolchain
        run: |
          wasmtime --version
          wasm-tools --version
          test "$(wasmtime --version | awk '{print $2}')" = "48.0.0"
          test "$(wasm-tools --version | awk '{print $2}')" = "1.254.0"

      - name: Compile Wasmtime fixtures
        run: node scripts/compile_wasmtime_fixtures.mjs

      - name: Wasmtime real runtime tests
        run: node --test test/wasmtime-real-runtime.test.mjs

      - name: Wasmtime resource-limit tests
        run: node --test test/wasmtime-resource-limits.test.mjs

      - name: MCP delegation tests
        run: npm run test:mcp-delegation

      - name: Credential broker tests
        run: npm run test:credential-broker

      - name: Credential vault HTTP tests
        run: node --test test/credential-vault-http.test.mjs

      - name: Google connector tests
        run: npm run test:google-connector

      - name: GitHub connector tests
        run: npm run test:github-connector

      - name: Capability sandbox tests
        run: npm run test:capabilities

      - name: Publication tests
        run: npm run test:publication

      - name: Build
        run: npm run build

      - name: Verify built GitHub connector client
        run: node scripts/verify_github_connector_build.mjs

      - name: Verify built Google Drive connector client
        run: node scripts/verify_google_drive_connector_build.mjs

      - name: Verify credential boundary
        run: node scripts/verify_credential_boundary.mjs

      - name: Verify MCP delegation boundary
        run: node scripts/verify_mcp_delegation_boundary.mjs

      - name: Dynamic logic regression
        run: npm run verify:dynamic-logic

      - name: Dynamic rendering regression
        run: npm run verify:dynamic-rendering

      - name: Package verified PR source
        run: git archive --format=zip --output=eveglyph-mcp-delegated-connector-operations.zip HEAD

      - name: Upload verified PR source
        uses: actions/upload-artifact@v4
        with:
          name: eveglyph-mcp-delegated-connector-operations
          path: eveglyph-mcp-delegated-connector-operations.zip
          if-no-files-found: error
          retention-days: 14
