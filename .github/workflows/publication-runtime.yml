name: Publication Runtime

on:
  push:
    branches:
      - feat/mcp-publication-runtime-mvp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # This PR introduces a native optional-dependency package. Use npm install
      # while the generated package-lock update is still pending; before merge,
      # regenerate/commit package-lock.json and switch this back to npm ci.
      - name: Install dependencies
        run: npm install

      - name: Publication tests
        run: npm run test:publication

      - name: Build
        run: npm run build

      - name: Dynamic logic regression
        run: npm run verify:dynamic-logic

      - name: Dynamic rendering regression
        run: npm run verify:dynamic-rendering
