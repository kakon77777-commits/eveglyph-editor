name: Publication Runtime

on:
  push:
    branches:
      - feat/mcp-publication-runtime-mvp
      - feat/github-connector-broker
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: GitHub connector tests
        run: npm run test:github-connector

      - name: Capability sandbox tests
        run: npm run test:capabilities

      - name: Publication tests
        run: npm run test:publication

      - name: Build
        run: npm run build

      - name: Dynamic logic regression
        run: npm run verify:dynamic-logic

      - name: Dynamic rendering regression
        run: npm run verify:dynamic-rendering

      - name: Package verified PR source
        run: git archive --format=zip --output=eveglyph-github-connector-broker.zip HEAD

      - name: Upload verified PR source
        uses: actions/upload-artifact@v4
        with:
          name: eveglyph-github-connector-broker
          path: eveglyph-github-connector-broker.zip
          if-no-files-found: error
          retention-days: 14
