name: PR-E One-Shot Docs Patch

on:
  push:
    branches:
      - feat/mcp-delegated-connector-operations

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply exact docs migration
        run: node scripts/apply_pre_task6_docs_patch.mjs

      - name: Commit docs migration
        run: |
          if git diff --quiet -- README.md SECURITY.md; then
            echo "docs already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SECURITY.md
          git commit -m "chore: migrate PR-D MCP docs to PR-E"
          git push origin HEAD:${GITHUB_REF_NAME}
