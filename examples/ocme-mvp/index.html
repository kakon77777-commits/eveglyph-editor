<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OCME MVP</title><style>
:root{font-family:Inter,"Noto Sans TC",sans-serif;color:#172033;background:#f5f7fb;line-height:1.7}*{box-sizing:border-box}body{margin:0}header{background:#111a31;color:#fff;padding:60px max(24px,calc((100% - 1040px)/2))}h1{font:700 clamp(2.5rem,7vw,5rem) Georgia,"Noto Serif TC",serif;margin:.2em 0}.lead{max-width:760px;opacity:.82}.shell{max-width:1040px;margin:auto;padding:32px 20px 70px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:1px solid #d8dfeb;border-radius:999px;background:#fff;padding:9px 15px;cursor:pointer}button.on{background:#172033;color:#fff}.panel{display:none;background:#fff;border:1px solid #dfe4ef;border-radius:20px;padding:clamp(22px,5vw,44px);box-shadow:0 16px 50px #1c27450f}.panel.on{display:block}h2,h3{font-family:Georgia,"Noto Serif TC",serif}.formula{font-size:2rem;text-align:center;background:#fafbfe;border:1px solid #e2e7f0;border-radius:16px;padding:28px;overflow:auto}pre{overflow:auto;background:#101725;color:#dce6ff;border-radius:14px;padding:18px}.warn{border-left:4px solid #b06a15;background:#fff5e9;padding:14px 16px;margin:18px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5e9f1;vertical-align:top}
</style></head><body><header><small>OPEN CHINESE MATHEMATICAL ENCYCLOPEDIA · MVP</small><h1 id="title"></h1><p class="lead" id="summary"></p></header><main class="shell"><nav class="tabs"></nav><div id="panels"></div></main><script type="module">
const m=await fetch('./mko.json').then(r=>r.json()), esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
title.textContent=m.titles['zh-Hant'];summary.textContent=m.summary['zh-Hant'];
const tabs=[['math','數學'],['explain','解釋'],['code','程式碼'],['evidence','計算證據'],['formal','形式化'],['ai','AI 結構']];
const content={math:`<h2>定理敘述</h2><p>${esc(m.statement['zh-Hant'])}</p><div class="formula">${m.formula.mathml}<br><code>${esc(m.formula.tex)}</code></div><h3>條件</h3><ul>${m.assumptions.map(x=>`<li>${esc(x['zh-Hant'])}</li>`).join('')}</ul><h3>符號</h3><table>${m.symbols.map(x=>`<tr><td><code>${x.token}</code></td><td>${esc(x.role_zh)}</td></tr>`).join('')}</table>`,explain:`<h2>直觀解釋</h2>${m.explanation.paragraphs_zh.map(x=>`<p>${esc(x)}</p>`).join('')}<div class="warn"><b>常見誤解：</b>${esc(m.explanation.common_misconception_zh)}</div>`,code:`<h2>Python 計算伴隨</h2><div class="warn"><b>非同一性聲明：</b>${esc(m.computational_companions[0].warning)}</div><pre>${esc(m.computational_companions[0].source)}</pre><p><b>遺漏：</b>${m.computational_companions[0].non_identity.omitted.map(esc).join('、')}</p>`,evidence:`<h2>有限計算證據</h2><div class="warn">${esc(m.verification.warning_zh)}</div><table>${m.verification.evidence.tests.map(x=>`<tr><td>${esc(x.name_zh)}</td><td>${esc(x.method)}</td><td>${esc(x.result)}</td></tr>`).join('')}</table>`,formal:`<h2>形式化狀態</h2><p>${esc(m.formalization.status)}</p><p>${esc(m.formalization.next_obligation_zh)}</p>`,ai:`<h2>Canonical MKO</h2><pre>${esc(JSON.stringify(m,null,2))}</pre>`};
for(const [id,label] of tabs){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{document.querySelectorAll('button,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector(`[data-panel="${id}"]`).classList.add('on')};document.querySelector('.tabs').append(b);const p=document.createElement('section');p.className='panel';p.dataset.panel=id;p.innerHTML=content[id];panels.append(p)}document.querySelector('button').click();
</script></body></html>
